name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows matches the machine the pipeline runs on (paths, tzdata, file locking).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
