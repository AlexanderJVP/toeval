name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows matches the machine the pipeline runs on (paths, tzdata, file locking).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # All hooks, incl. ruff check/format and the YAML/TOML/whitespace/private-key checks.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest
